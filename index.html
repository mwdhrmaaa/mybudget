<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBudget - Financial Telemetry & Expense Analytics</title>
    <meta name="description" content="Production-grade client-side daily expense tracking and budget telemetry platform.">
    <meta name="theme-color" content="#090a0d">

    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/toast.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Left Slide Bar / Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 0.45rem;">
                    <div style="display: flex; align-items: center; gap: 0.45rem;">
                        <button id="sidebarCloseBtn" class="btn btn-ghost btn-sidebar-close" style="padding: 0.35rem; border-radius: var(--radius-md);" title="Tutup Slide bar">
                            <i data-lucide="menu" style="width: 17px; height: 17px;"></i>
                        </button>
                        <a href="#" class="brand-logo" style="gap: 0.45rem;">
                            <div class="brand-icon" style="width: 26px; height: 26px; border-radius: 6px;">
                                <i data-lucide="wallet-cards" style="width: 14px; height: 14px;"></i>
                            </div>
                            <span style="font-size: 0.98rem; font-weight: 700;">MyBudget</span>
                        </a>
                    </div>
                    <button id="sidebarModeToggleBtn" class="sidebar-header-mode-btn" title="Ganti Mode (Simple / Complex)">
                        <i data-lucide="minimize-2" id="sidebarModeIcon" style="width: 11px; height: 11px;"></i>
                        <span id="sidebarModeLabel">Complex</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-body">
                <!-- Navigation Section -->
                <div class="sidebar-nav-group">
                    <div class="sidebar-section-label">NAVIGASI</div>
                    <button class="sidebar-nav-btn active" id="sidebarTabDashboardBtn" data-tab="dashboard">
                        <i data-lucide="layout-dashboard" style="width: 17px; height: 17px;"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="sidebar-nav-btn" id="sidebarTabBudgetsBtn" data-tab="budgets">
                        <i data-lucide="pie-chart" style="width: 17px; height: 17px;"></i>
                        <span>Rencana Anggaran</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="btn btn-primary" id="sidebarAddExpenseBtn" style="width: 100%; justify-content: center; padding: 0.55rem 0.85rem; font-size: 0.85rem;">
                    <i data-lucide="plus" style="width: 15px; height: 15px;"></i>
                    <span>Catat Transaksi</span>
                </button>
                <button class="btn btn-ghost" id="sidebarShortcutsBtn" style="width: 100%; justify-content: space-between; padding: 0.45rem 0.75rem; font-size: 0.75rem; color: var(--text-muted);">
                    <span style="display: flex; align-items: center; gap: 0.4rem;">
                        <i data-lucide="keyboard" style="width: 13px; height: 13px;"></i>
                        <span>Pintasan</span>
                    </span>
                    <kbd style="padding: 0.15rem 0.4rem; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 0.7rem;">?</kbd>
                </button>
            </div>
        </aside>

        <!-- Sidebar backdrop overlay for mobile/slide -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Main Content Area -->
        <div class="app-main">
            <header class="site-header">
                <div class="container nav-wrapper">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <button id="sidebarToggleBtn" class="btn btn-ghost header-toggle-btn" style="padding: 0.4rem; border-radius: var(--radius-md);" title="Buka/Tutup Slide bar">
                            <i data-lucide="menu" style="width: 17px; height: 17px;"></i>
                        </button>
                        <a href="#" class="brand-logo header-brand-logo" id="headerBrandLogo">
                            <div class="brand-icon">
                                <i data-lucide="wallet-cards" style="width: 16px; height: 16px;"></i>
                            </div>
                            <span>MyBudget</span>
                        </a>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <button class="btn btn-primary" id="openAddExpenseBtn" title="Catat Transaksi">
                            <i data-lucide="plus" style="width: 14px; height: 14px;"></i>
                            <span>Catat</span>
                        </button>
                    </div>
                </div>
            </header>

    <main class="main-content">
        <div class="container" style="display: flex; flex-direction: column; gap: 1.25rem;">
            
            <!-- SECTION 1: COMPLEX / TELEMETRY DASHBOARD -->
            <section id="dashboardSection" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <!-- Clean Dashboard Header -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                    <div>
                        <h1 style="font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary);">Dashboard</h1>
                    </div>
                    <div style="display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
                        <input type="file" id="importFileInput" accept=".json" style="display: none;">
                        <button class="btn btn-ghost" id="importDataBtn" title="Pulihkan data dari berkas JSON">
                            <i data-lucide="upload" style="width: 13px; height: 13px;"></i>
                            <span>Restore</span>
                        </button>
                        <button class="btn btn-ghost" id="exportDataBtn" title="Unduh cadangan data JSON">
                            <i data-lucide="download" style="width: 13px; height: 13px;"></i>
                            <span>Backup</span>
                        </button>
                        <button class="btn btn-ghost" id="openAddBudgetFromDashBtn" title="Atur target pagu pengeluaran">
                            <i data-lucide="target" style="width: 13px; height: 13px;"></i>
                            <span>Atur Pagu</span>
                        </button>
                    </div>
                </div>

                <!-- 4 Metrics Cards -->
                <div id="metricsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem;"></div>

                <!-- 2 Visual Charts Grid -->
                <div class="charts-grid">
                    <div class="glass-panel" style="padding: 1.25rem;">
                        <div style="margin-bottom: 1rem;">
                            <h2 style="font-size: 0.875rem; font-weight: 600; color: var(--text-primary);">Tren Pengeluaran 14 Hari</h2>
                        </div>
                        <div style="height: 200px; width: 100%;">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>

                    <div class="glass-panel" style="padding: 1.25rem;">
                        <div style="margin-bottom: 1rem;">
                            <h2 style="font-size: 0.875rem; font-weight: 600; color: var(--text-primary);">Distribusi Kategori</h2>
                        </div>
                        <div style="height: 200px; width: 100%; position: relative;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Filter Toolbar & Table Data -->
                <div class="glass-panel" style="padding: 1.25rem;">
                    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border-subtle);">
                        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;">
                            <input type="text" id="filterSearch" placeholder="Cari transaksi... (/)" class="form-input" style="width: 170px;">
                            
                            <select id="filterType" class="form-select" style="width: 120px;">
                                <option value="all">Semua Tipe</option>
                                <option value="expense">Pengeluaran</option>
                                <option value="income">Pemasukan</option>
                            </select>

                            <select id="filterCategory" class="form-select" style="width: 150px;">
                                <option value="">Semua Kategori</option>
                            </select>

                            <input type="date" id="filterStartDate" class="form-input" style="width: 125px;">
                            <span style="color: var(--text-muted); font-size: 0.75rem;">-</span>
                            <input type="date" id="filterEndDate" class="form-input" style="width: 125px;">

                            <button id="resetFilterBtn" class="btn btn-ghost" style="padding: 0.42rem 0.55rem;" title="Reset Filter">
                                <i data-lucide="rotate-ccw" style="width: 13px; height: 13px;"></i>
                            </button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.65rem;">
                            <div id="filterCountLabel" style="color: var(--text-muted); font-size: 0.78rem;">
                                Memuat data...
                            </div>
                            <button id="exportCsvBtn" class="btn btn-ghost" title="Ekspor data tabel ke CSV">
                                <i data-lucide="file-spreadsheet" style="width: 13px; height: 13px; color: #34d399;"></i>
                                <span>CSV</span>
                            </button>
                        </div>
                    </div>

                    <div id="expenseTableContainer"></div>
                </div>
            </section>

            <!-- SECTION 2: COMPLEX / BUDGET VIEW -->
            <section id="budgetsSection" style="display: none; flex-direction: column; gap: 1.25rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                    <div>
                        <h1 style="font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary);">Rencana Anggaran</h1>
                    </div>
                    <button class="btn btn-primary" id="openAddBudgetBtn">
                        <i data-lucide="plus" style="width: 14px; height: 14px;"></i>
                        <span>Anggaran Baru</span>
                    </button>
                </div>

                <div id="budgetListContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem;"></div>
            </section>

            <!-- SECTION 3: SIMPLE / MINIMALIST VIEW -->
            <section id="simpleSection" style="display: none; flex-direction: column; gap: 1.25rem;"></section>

        </div>
    </main>

    <!-- Global Modal Dialog -->
    <div class="modal-overlay" id="globalModal">
        <div class="modal-dialog">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                <h2 id="modalTitle" style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">Form Transaksi</h2>
                <button id="modalCloseBtn" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">
                    <i data-lucide="x" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container footer-content">
            <div style="color: var(--text-muted); font-size: 0.75rem;">
                &copy; 2026 MyBudget
            </div>
            <div class="connection-badge" id="connectionBadge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Online</span>
            </div>
        </div>
    </footer>
    </div> <!-- /.app-main -->
    </div> <!-- /.app-layout -->

    <!-- Application Bootstrap Module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
